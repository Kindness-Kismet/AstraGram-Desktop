name: Build-release

# 版本文件变化即发版：构建并校验产物后，在上传前创建标签。
on:
  push:
    branches:
      - main
      - dev
    paths:
      - 'Telegram/build/version'

permissions:
  contents: read

env:
  RELEASE_DONATION_NOTICE: |-
    Donations are optional and never affect feature access. If AstraGram is useful to you, you can consider supporting the project through Afdian at https://afdian.com/a/KiritoXD under the account KiritoXDone. Contributions help cover daily token maintenance costs and encourage us to keep maintaining the project

    捐赠完全自愿，不会影响任何功能使用。如果 AstraGram 对你有帮助，欢迎量力通过爱发电支持项目，账户为 KiritoXDone：https://afdian.com/a/KiritoXD。捐赠主要用于日常 token 维护开销，也会让我们更有动力继续维护项目

# 发版排队执行，不中断已在构建的版本。
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  validate:
    name: Tests and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      appversion: ${{ steps.version.outputs.appversion }}
      publish: ${{ steps.version.outputs.publish }}
      name: ${{ steps.version.outputs.name }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make_latest: ${{ steps.version.outputs.make_latest }}

    steps:
      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Validate workflows.
        env:
          ACTIONLINT_VERSION: 1.7.12
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$archive" "$base/$archive"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/actionlint_checksums.txt" \
            "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep "  ${archive}$" "$RUNNER_TEMP/actionlint_checksums.txt" \
            | (cd "$RUNNER_TEMP" && sha256sum --check -)
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=

      - name: Set up Python.
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Test release and build helpers.
        run: PYTHONPATH=scripts python3 -m unittest discover -s scripts/build_support/tests

      - name: Read version and enforce release channel.
        id: version
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
        run: python3 scripts/release_config.py --branch "$SOURCE_BRANCH" --output "$GITHUB_OUTPUT"

      - name: Validate release inputs.
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py \
            .github/CHANGELOG.md "$RUNNER_TEMP/changelog.md"
          {
            printf '%s\n\n' "$RELEASE_DONATION_NOTICE"
            printf '%s\n\n' '---'
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

  windows-x64:
    name: Windows x64 remote build
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      run_id: ${{ steps.remote.outputs.run_id }}
      run_attempt: ${{ steps.remote.outputs.run_attempt }}
      run_url: ${{ steps.remote.outputs.run_url }}

    steps:
      - name: Check out orchestration code.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Dispatch and wait for Windows x64.
        id: remote
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          exec python3 scripts/remote_build.py \
            --label "Windows x64" \
            --repository Kindness-Net/AstraGram-Desktop-Windows-Build \
            --workflow build.yml \
            --ref main \
            --source-sha "$GITHUB_SHA" \
            --source-ref "refs/tags/${{ needs.validate.outputs.tag }}" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "${{ needs.validate.outputs.version }}" \
            --appupdateversion "${{ needs.validate.outputs.appversion }}" \
            --timeout-seconds 21300

      - name: Cancel Windows x64 remote build.
        if: ${{ cancelled() && steps.remote.outputs.run_id != '' }}
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          REMOTE_RUN_ID: ${{ steps.remote.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          from scripts.remote_build import GitHubApi, cancel_remote_run

          cancel_remote_run(
              GitHubApi(os.environ["REMOTE_BUILD_TOKEN"]),
              "Kindness-Net/AstraGram-Desktop-Windows-Build",
              int(os.environ["REMOTE_RUN_ID"]),
          )
          PY

  windows-arm64:
    name: Windows ARM64 remote build
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      run_id: ${{ steps.remote.outputs.run_id }}
      run_attempt: ${{ steps.remote.outputs.run_attempt }}
      run_url: ${{ steps.remote.outputs.run_url }}

    steps:
      - name: Check out orchestration code.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Dispatch and wait for Windows ARM64.
        id: remote
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          exec python3 scripts/remote_build.py \
            --label "Windows ARM64" \
            --repository Kindness-Net/AstraGram-Desktop-Windows-ARM64-Build \
            --workflow build.yml \
            --ref main \
            --source-sha "$GITHUB_SHA" \
            --source-ref "refs/tags/${{ needs.validate.outputs.tag }}" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "${{ needs.validate.outputs.version }}" \
            --appupdateversion "${{ needs.validate.outputs.appversion }}" \
            --timeout-seconds 21300

      - name: Cancel Windows ARM64 remote build.
        if: ${{ cancelled() && steps.remote.outputs.run_id != '' }}
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          REMOTE_RUN_ID: ${{ steps.remote.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          from scripts.remote_build import GitHubApi, cancel_remote_run

          cancel_remote_run(
              GitHubApi(os.environ["REMOTE_BUILD_TOKEN"]),
              "Kindness-Net/AstraGram-Desktop-Windows-ARM64-Build",
              int(os.environ["REMOTE_RUN_ID"]),
          )
          PY

  linux:
    name: Linux remote build
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      run_id: ${{ steps.remote.outputs.run_id }}
      run_attempt: ${{ steps.remote.outputs.run_attempt }}
      run_url: ${{ steps.remote.outputs.run_url }}

    steps:
      - name: Check out orchestration code.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Dispatch and wait for Linux.
        id: remote
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          exec python3 scripts/remote_build.py \
            --label Linux \
            --repository Kindness-Net/AstraGram-Desktop-Linux-Build \
            --workflow build.yml \
            --ref main \
            --source-sha "$GITHUB_SHA" \
            --source-ref "refs/tags/${{ needs.validate.outputs.tag }}" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "${{ needs.validate.outputs.version }}" \
            --appupdateversion "${{ needs.validate.outputs.appversion }}" \
            --timeout-seconds 21300

      - name: Cancel Linux remote build.
        if: ${{ cancelled() && steps.remote.outputs.run_id != '' }}
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          REMOTE_RUN_ID: ${{ steps.remote.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          from scripts.remote_build import GitHubApi, cancel_remote_run

          cancel_remote_run(
              GitHubApi(os.environ["REMOTE_BUILD_TOKEN"]),
              "Kindness-Net/AstraGram-Desktop-Linux-Build",
              int(os.environ["REMOTE_RUN_ID"]),
          )
          PY

  macos:
    name: macOS remote build
    needs: validate
    if: needs.validate.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      run_id: ${{ steps.remote.outputs.run_id }}
      run_attempt: ${{ steps.remote.outputs.run_attempt }}
      run_url: ${{ steps.remote.outputs.run_url }}

    steps:
      - name: Check out orchestration code.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      - name: Dispatch and wait for macOS.
        id: remote
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
        run: |
          set -euo pipefail
          exec python3 scripts/remote_build.py \
            --label macOS \
            --repository Kindness-Net/AstraGram-Desktop-macOS-Build \
            --workflow build.yml \
            --ref main \
            --source-sha "$GITHUB_SHA" \
            --source-ref "refs/tags/${{ needs.validate.outputs.tag }}" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "${{ needs.validate.outputs.version }}" \
            --appupdateversion "${{ needs.validate.outputs.appversion }}" \
            --timeout-seconds 21300

      - name: Cancel macOS remote build.
        if: ${{ cancelled() && steps.remote.outputs.run_id != '' }}
        env:
          REMOTE_BUILD_TOKEN: ${{ secrets.REMOTE_BUILD_TOKEN }}
          REMOTE_RUN_ID: ${{ steps.remote.outputs.run_id }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os

          from scripts.remote_build import GitHubApi, cancel_remote_run

          cancel_remote_run(
              GitHubApi(os.environ["REMOTE_BUILD_TOKEN"]),
              "Kindness-Net/AstraGram-Desktop-macOS-Build",
              int(os.environ["REMOTE_RUN_ID"]),
          )
          PY

  # 单个平台失败不阻塞其余平台发布；补发缺失平台用 Re-run failed jobs，已成功平台沿用原 attempt 的产物。
  publish:
    name: Verify and publish release
    needs: [validate, windows-x64, windows-arm64, linux, macos]
    if: ${{ !cancelled() && needs.validate.result == 'success' && needs.validate.outputs.publish == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Check out repository.
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # 远程运行结束才有 attempt；失败的运行可能只上传了部分架构，下载失败不中断发布。
      - name: Download Windows x64 artifacts.
        if: needs.windows-x64.outputs.run_attempt != ''
        continue-on-error: ${{ needs.windows-x64.result != 'success' }}
        uses: actions/download-artifact@v8
        with:
          repository: Kindness-Net/AstraGram-Desktop-Windows-Build
          run-id: ${{ needs.windows-x64.outputs.run_id }}
          github-token: ${{ secrets.REMOTE_BUILD_TOKEN }}
          pattern: AstraGram-*
          merge-multiple: true
          path: artifacts/windows

      - name: Download Windows ARM64 artifacts.
        if: needs.windows-arm64.outputs.run_attempt != ''
        continue-on-error: ${{ needs.windows-arm64.result != 'success' }}
        uses: actions/download-artifact@v8
        with:
          repository: Kindness-Net/AstraGram-Desktop-Windows-ARM64-Build
          run-id: ${{ needs.windows-arm64.outputs.run_id }}
          github-token: ${{ secrets.REMOTE_BUILD_TOKEN }}
          pattern: AstraGram-*
          merge-multiple: true
          path: artifacts/windows-arm64

      - name: Download Linux artifacts.
        if: needs.linux.outputs.run_attempt != ''
        continue-on-error: ${{ needs.linux.result != 'success' }}
        uses: actions/download-artifact@v8
        with:
          repository: Kindness-Net/AstraGram-Desktop-Linux-Build
          run-id: ${{ needs.linux.outputs.run_id }}
          github-token: ${{ secrets.REMOTE_BUILD_TOKEN }}
          pattern: AstraGram-*
          merge-multiple: true
          path: artifacts/linux

      - name: Download macOS artifacts.
        if: needs.macos.outputs.run_attempt != ''
        continue-on-error: ${{ needs.macos.result != 'success' }}
        uses: actions/download-artifact@v8
        with:
          repository: Kindness-Net/AstraGram-Desktop-macOS-Build
          run-id: ${{ needs.macos.outputs.run_id }}
          github-token: ${{ secrets.REMOTE_BUILD_TOKEN }}
          pattern: AstraGram-*
          merge-multiple: true
          path: artifacts/macos

      - name: Verify artifact provenance.
        env:
          SOURCE_REF: refs/tags/${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          APPVERSION: ${{ needs.validate.outputs.appversion }}
          WINDOWS_RESULT: ${{ needs.windows-x64.result }}
          WINDOWS_RUN_ID: ${{ needs.windows-x64.outputs.run_id }}
          WINDOWS_RUN_ATTEMPT: ${{ needs.windows-x64.outputs.run_attempt }}
          WINDOWS_ARM64_RESULT: ${{ needs.windows-arm64.result }}
          WINDOWS_ARM64_RUN_ID: ${{ needs.windows-arm64.outputs.run_id }}
          WINDOWS_ARM64_RUN_ATTEMPT: ${{ needs.windows-arm64.outputs.run_attempt }}
          LINUX_RESULT: ${{ needs.linux.result }}
          LINUX_RUN_ID: ${{ needs.linux.outputs.run_id }}
          LINUX_RUN_ATTEMPT: ${{ needs.linux.outputs.run_attempt }}
          MACOS_RESULT: ${{ needs.macos.result }}
          MACOS_RUN_ID: ${{ needs.macos.outputs.run_id }}
          MACOS_RUN_ATTEMPT: ${{ needs.macos.outputs.run_attempt }}
        run: |
          set -euo pipefail
          build_runs='{}'
          # 按实际下载到的来源清单登记目标；平台构建成功却缺少必有目标时停止发布。
          add_target() {
            local key=$1 repository=$2 run_id=$3 attempt=$4 result=$5 expected=$6
            if ! find artifacts -type f -name "provenance-${key}.json" \
              -print -quit 2>/dev/null | grep -q .; then
              if test "$result" = success && test "$expected" = true; then
                echo "::error::${key} build succeeded but its provenance is missing."
                exit 1
              fi
              echo "::warning::${key} is not included in this release."
              return 0
            fi
            build_runs=$(jq -cn \
              --argjson current "$build_runs" \
              --arg key "$key" \
              --arg repository "$repository" \
              --argjson run "$run_id" \
              --argjson attempt "$attempt" \
              '$current + {($key): {repository: $repository, run_id: $run, run_attempt: $attempt}}')
          }

          add_target windows-x64 Kindness-Net/AstraGram-Desktop-Windows-Build \
            "$WINDOWS_RUN_ID" "$WINDOWS_RUN_ATTEMPT" "$WINDOWS_RESULT" true
          add_target windows-arm64 Kindness-Net/AstraGram-Desktop-Windows-ARM64-Build \
            "$WINDOWS_ARM64_RUN_ID" "$WINDOWS_ARM64_RUN_ATTEMPT" "$WINDOWS_ARM64_RESULT" true
          add_target linux-x64 Kindness-Net/AstraGram-Desktop-Linux-Build \
            "$LINUX_RUN_ID" "$LINUX_RUN_ATTEMPT" "$LINUX_RESULT" true
          add_target linux-arm64 Kindness-Net/AstraGram-Desktop-Linux-Build \
            "$LINUX_RUN_ID" "$LINUX_RUN_ATTEMPT" "$LINUX_RESULT" false
          add_target macos-x64 Kindness-Net/AstraGram-Desktop-macOS-Build \
            "$MACOS_RUN_ID" "$MACOS_RUN_ATTEMPT" "$MACOS_RESULT" true
          add_target macos-arm64 Kindness-Net/AstraGram-Desktop-macOS-Build \
            "$MACOS_RUN_ID" "$MACOS_RUN_ATTEMPT" "$MACOS_RESULT" true

          python3 scripts/build_provenance.py verify-artifacts \
            --root artifacts \
            --source-repository "$GITHUB_REPOSITORY" \
            --source-sha "$GITHUB_SHA" \
            --source-ref "$SOURCE_REF" \
            --source-run-id "$GITHUB_RUN_ID" \
            --source-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --version "$VERSION" \
            --appupdateversion "$APPVERSION" \
            --build-runs "$build_runs"

      - name: Collect verified release files.
        run: |
          set -euo pipefail
          mkdir release-artifacts
          while IFS= read -r -d '' file; do
            name=$(basename "$file")
            case "$name" in
              provenance-*.json) continue ;;
            esac
            test ! -e "release-artifacts/$name"
            cp -- "$file" "release-artifacts/$name"
          done < <(find artifacts -type f -print0)

      - name: Generate update map.
        if: needs.validate.outputs.prerelease == 'false'
        env:
          APPVERSION: ${{ needs.validate.outputs.appversion }}
        run: |
          set -euo pipefail
          python3 scripts/release_update_map.py release-artifacts "$APPVERSION"

      - name: List release files.
        run: |
          set -euo pipefail
          find release-artifacts -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Generate release notes.
        run: |
          set -euo pipefail
          python3 scripts/release_notes.py \
            .github/CHANGELOG.md "$RUNNER_TEMP/changelog.md"
          {
            printf '%s\n\n' "$RELEASE_DONATION_NOTICE"
            printf '%s\n\n' '---'
            cat "$RUNNER_TEMP/changelog.md"
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"

      # 一个版本号只对应一个提交；重跑时标签已指向本提交则直接沿用。
      - name: Create the release tag.
        env:
          TAG: ${{ needs.validate.outputs.tag }}
        run: |
          set -euo pipefail
          direct=$(git ls-remote --refs origin "refs/tags/$TAG" | cut -f1)
          peeled=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          existing=${peeled:-$direct}
          if test -z "$existing"; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
            echo "::notice::Created $TAG at $GITHUB_SHA."
          elif test "$existing" = "$GITHUB_SHA"; then
            echo "::notice::$TAG already points at this commit."
          else
            echo "::error::$TAG already points at $existing; bump the version for a new release."
            exit 1
          fi

      - name: Publish release.
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AstraGram ${{ needs.validate.outputs.name }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: release-artifacts/*
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          overwrite_files: true
          make_latest: ${{ needs.validate.outputs.make_latest }}
